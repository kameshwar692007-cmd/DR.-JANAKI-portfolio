<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="medBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="medBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2345"/>
      <stop offset="100%" stop-color="#061B3A"/>
    </linearGradient>
  </defs>
  <!-- Background rounded pill -->
  <rect width="512" height="512" rx="128" fill="url(#medBg)"/>
  
  <!-- Subtle inner ring -->
